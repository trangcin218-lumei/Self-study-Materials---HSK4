<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tự học HSK4</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--tx:#17235a;--mut:#46558a;--card:#fffaf7;--peach:#f2e2dc;--peachb:#d7beb3;--sky:#eaf4fd;--skyb:#80bdf2;--grey:#a9c6d9;--lav:#acb7f2;--acc:#5468d4;--w:#ffffff}
body{margin:0;color:var(--tx);font-family:Nunito,system-ui,"Noto Sans SC",sans-serif;font-weight:700;padding-bottom:120px;background:linear-gradient(160deg,#a2cdf2cc,#80bdf2dd 55%,#acb7f2cc),url(img/flower.jpg) center/cover fixed}
body.t1{background:linear-gradient(160deg,#acb7f2dd,#a2cdf2cc),url(img/flower.jpg) center/cover fixed}
body.t2{background:linear-gradient(160deg,#f2e2dcdd,#a2cdf2cc 70%,#80bdf2cc),url(img/flower.jpg) center/cover fixed}
*{box-sizing:border-box}button,select,input,textarea{font:inherit;color:inherit}
header{display:flex;gap:10px;align-items:center;padding:10px 18px;flex-wrap:wrap;background:#80bdf2e6;border-bottom:3px solid #fff8}
.logo{font-weight:800;font-size:1.4rem;margin-right:auto;display:flex;gap:8px;align-items:center}.sq{background:#fff;border-radius:12px;padding:4px 8px}
.bub{border:3px solid #fff;background:#d6ebfb;border-radius:22px;padding:6px 14px;cursor:pointer;font-weight:800;color:var(--tx)}
main{max-width:1050px;margin:0 auto;padding:16px}
.card{background:var(--card);border:3px solid var(--skyb);border-radius:28px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 4px 14px #17235a1f}
.sky{background:var(--sky)}.peach{background:var(--peach);border-color:var(--peachb)}
.cloud::after{content:'';position:absolute;right:-20px;bottom:-26px;width:150px;height:60px;background:#fff;opacity:.85;border-radius:50px;box-shadow:-130px 8px 0 -4px #fffc,-70px 16px 0 6px #fff;pointer-events:none}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.grid .card{margin:0}
.streak h2{font-size:3rem;margin:0;color:var(--acc)}
.wk{display:flex;justify-content:space-between;font-size:.8rem;margin-top:12px}.wk i{display:block;width:30px;height:30px;border-radius:50%;border:3px solid var(--grey);margin:4px auto;background:#fff8}.wk i.on{background:var(--acc);border-color:var(--acc)}
.bar{height:14px;background:var(--peach);border-radius:9px;overflow:hidden;border:2px solid var(--grey)}.bar div{height:100%;background:linear-gradient(90deg,var(--lav),var(--acc))}
.stat{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid #d6ebfb;border-radius:16px;padding:10px 16px;margin-bottom:8px;font-weight:800}.stat b{font-size:1.7rem;color:var(--acc)}
.quote{background:#fff;border-radius:18px;padding:12px 16px;display:flex;gap:10px;align-items:center;margin-top:12px;border:2px solid #d6ebfb}.quote span{flex:1}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:14px}.tile{cursor:pointer;font-weight:800;font-size:1.2rem;min-height:112px;padding-right:120px;margin:0}.tile:nth-child(1){background:var(--peach);border-color:var(--peachb)}
.tile img{position:absolute;right:6px;bottom:0;height:100px}
.cta{background:var(--acc);color:#fff;border:3px solid #fff;border-radius:18px;padding:8px 18px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px #17235a33}
.pill{border:2px solid var(--skyb);background:#fff;border-radius:14px;padding:5px 12px;cursor:pointer;font-weight:800}
.fc{font-size:2.8rem;text-align:center;padding:46px 10px;cursor:pointer;background:#fff;border:2px solid #d6ebfb;border-radius:20px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--grey)}.row .w{font-size:1.6rem;min-width:100px}.row .m{flex:1}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border:2px solid var(--skyb);border-radius:16px;background:#fff;cursor:pointer;font-weight:700}
.ok{background:#c4f1d4!important;border-color:#2f9a5d!important}.no{background:#ffd5d5!important;border-color:#d05a5a!important}
.item{margin:14px 0;padding-bottom:10px;border-bottom:2px dashed var(--grey)}.qq{font-size:1.25rem;margin-bottom:6px}
input,textarea,select{background:#fff;border:2px solid var(--skyb);border-radius:14px;padding:8px 12px;width:100%;margin:4px 0}
select.bub{width:auto;max-width:90vw}
.bars{display:flex;gap:8px;align-items:flex-end;height:100px}.bars div{flex:1;text-align:center;font-size:.72rem}.bars i{display:block;background:var(--acc);border-radius:8px 8px 0 0;min-height:4px;margin-bottom:2px}
nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#d8f3ee;border:3px solid #fff;border-radius:32px;padding:6px 8px;display:flex;gap:2px;box-shadow:0 6px 24px #17235a55;max-width:97vw}
nav button{border:0;background:none;border-radius:20px;padding:6px 9px;cursor:pointer;color:var(--tx);font-size:.74rem;font-weight:800;white-space:nowrap}nav button span{display:block;font-size:1.35rem}
nav button.on span{font-size:1.9rem;background:#fff;border:3px solid var(--grey);border-radius:50%;width:54px;height:54px;line-height:48px;margin:-30px auto 0}
</style></head><body>
<header><div class="logo"><span class="sq">📖</span> Tự học <span style="color:#fff;text-shadow:0 1px 2px #17235a88">HSK4</span></div>
<button class="bub" onclick="S.th=((S.th||0)+1)%3;save();paint()" title="Đổi màu nền">🎨</button>
<span><button class="bub" onclick="fs(-10)">A-</button> <b id="fz"></b> <button class="bub" onclick="fs(10)">A+</button></span>
<select class="bub" id="unit" onchange="U=this.value;pos=0;go(V)"></select>
<button class="bub" onclick="go('notes')" title="Ghi chú">📁</button><button class="bub" onclick="go('acct')" id="usr">👤</button></header>
<main id="m"></main><nav id="nav"></nav>
<script src="data.js"></script><script src="vocab_data.js"></script><script src="grammar_data.js"></script>
<script>

const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()-o);return d.toISOString().slice(0,10)};
const US=()=>{try{return JSON.parse(localStorage.getItem('hsk4_users')||'{}')}catch(e){return{}}};
let CUR=localStorage.getItem('hsk4_cur')||'guest',S;
function load(){S={learned:{},mine:[],notes:{},days:[],log:{},goal:10,dark:false,font:100};try{Object.assign(S,JSON.parse(localStorage.getItem('hsk4:'+CUR)||(CUR=='guest'?localStorage.getItem('hsk4'):null)||'{}'))}catch(e){}}
const save=()=>{try{localStorage.setItem('hsk4:'+CUR,JSON.stringify(S))}catch(e){}};
load();
let U='all',V='home',pos=0,flip=false,sc=[0,0],cur=[],qi=0,vmax=60,lastAct=Date.now();const MQ={};
const T=()=>S.log[day()]||(S.log[day()]={w:0,qa:0,qc:0,wr:0,m:0});
const touch=()=>{if(!S.days.includes(day()))S.days.push(day())};
function track(k,n=1){T()[k]+=n;touch();save()}
const xp=l=>(l.w||0)*5+(l.qc||0)*2+(l.wr||0)*3;
function mark(w,v){if(v&&!S.learned[w])track('w');S.learned[w]=v?1:0;save()}
const all=()=>[...VOCAB,...S.mine].map(a=>({w:a[0],p:a[1],t:a[2],m:a[3],u:+a[4]}));
const pool=()=>{const p=all().filter(v=>U=='all'||v.u==U);return p.length?p:all()};
const note=()=>(U!='all'&&!all().some(v=>v.u==U))?`<p style="color:var(--mut)">Từ vựng chưa được chia theo bài — đang hiển thị toàn bộ danh sách.</p>`:'';
const streak=()=>{let n=0,o=S.days.includes(day())?0:1;while(S.days.includes(day(o))){n++;o++}return n};
const speak=w=>{try{const u=new SpeechSynthesisUtterance(w);u.lang='zh-CN';speechSynthesis.speak(u)}catch(e){}};
const shuf=a=>[...a].sort(()=>Math.random()-.5);
addEventListener('click',()=>lastAct=Date.now());addEventListener('keydown',()=>lastAct=Date.now());
setInterval(()=>{if(!document.hidden&&Date.now()-lastAct<120000){T().m++;save()}},60000);
function fs(d){S.font=Math.max(80,Math.min(160,S.font+d));save();paint()}
const NAV=[['home','🐾','Trang chủ'],['vocab','📘','Từ vựng'],['cards','🃏','Thẻ nhớ'],['gram','🧩','Ngữ pháp'],['quiz','🧠','Trắc nghiệm'],['write','✍️','Luyện viết'],['notes','📝','Ghi chú'],['add','➕','Thêm từ'],['acct','👤','Tài khoản']];
function paint(){document.body.className='t'+(S.th||0);document.documentElement.style.fontSize=S.font+'%';$('fz').textContent=S.font+'%';$('usr').textContent='👤 '+(CUR=='guest'?'Đăng nhập':CUR);
 $('unit').innerHTML='<option value="all">Tất cả các bài</option><option value="0">Danh sách từ</option>'+LESSONS.map(l=>`<option value="${l[0]}">Bài ${l[0]}: ${l[1]} — ${l[2]}</option>`).join('');$('unit').value=U;
 $('nav').innerHTML=NAV.map(n=>`<button class="${V==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}
function go(v){V=v;paint();R[v]();scrollTo(0,0)}
const lc=()=>all().filter(v=>S.learned[v.w]).length;
const EMPTY=(n=1)=>`<div class="card">Chưa có từ nào (cần tối thiểu ${n} từ).</div>`;
// ---- generic multiple choice ----
function mcq(id,qs){MQ[id]=qs;$(id).innerHTML=qs.map((x,i)=>`<div class="item"><div class="qq">${x.q}</div>${x.o.map((o,j)=>`<button class="opt" onclick="pa('${id}',${i},${j},this)">${esc(o)}</button>`).join('')}</div>`).join('')||'<small>Phần này chưa có bài tập.</small>'}
function pa(id,i,j,b){const x=MQ[id][i];if(x.d)return;x.d=1;const ok=x.o[j]==x.a;track('qa');if(ok){track('qc');if(x.w)mark(x.w,1)}b.classList.add(ok?'ok':'no');if(!ok)[...b.parentNode.querySelectorAll('.opt')].find(e=>e.textContent==x.a).classList.add('ok')}
function vq(list,n){const P=all();return shuf(list).slice(0,n).map(v=>({q:`<b style="font-size:1.7rem">${v.w}</b> <small>${v.p}</small>`,a:v.m,w:v.w,o:shuf([v.m,...shuf(P.filter(x=>x.m!=v.m)).slice(0,3).map(x=>x.m)])}))}
function keyOf(h){const m=(h.match(/^[^A-Za-z\u00C0-\u1EF9]*/)||[''])[0];return m.split(/[。\.…\+\s\/（）()，,]+/).filter(x=>/[\u4e00-\u9fff]/.test(x)).sort((a,b)=>b.length-a.length)[0]||''}
function cloze(u){const pts=GRAMMAR.filter(g=>g[0]==u),keys=pts.map(g=>keyOf(g[1])),allk=[...new Set(GRAMMAR.map(g=>keyOf(g[1])).filter(Boolean))],qs=[];
 pts.forEach((g,i)=>{const k=keys[i];if(!k)return;const ss=g[2].split('\n').flatMap(l=>l.split(/(?<=[。？！])/)).map(s=>s.replace(/^[AB][：:]\s*/,'').trim()).filter(s=>/^[\u4e00-\u9fff，。？！、“”：；（）·…—\s]+$/.test(s)&&s.length>=8&&s.length<=45&&s.split(k).length==2);
  if(!ss.length)return;const s=shuf(ss)[0],d=shuf([...keys.filter(x=>x&&x!=k&&!x.includes(k)&&!k.includes(x)),...shuf(allk).filter(x=>!x.includes(k)&&!k.includes(x))]).filter((x,j,a)=>a.indexOf(x)==j).slice(0,3);
  qs.push({q:s.replace(k,'<b>＿＿＿</b>')+` <small style="color:var(--mut)">(${esc(g[1].split(' ')[0])})</small>`,a:k,o:shuf([k,...d])})});return qs}
const R={
home(){const A=all(),L=lc(),QUO=["Một ngôn ngữ khác là một cách nhìn cuộc sống khác. — Federico Fellini","Hành trình ngàn dặm bắt đầu từ một bước chân. — Lão Tử","Học rồi thường xuyên ôn tập, chẳng phải là niềm vui sao? — Khổng Tử"],
 mon=(new Date().getDay()+6)%7,t=T(),days=[6,5,4,3,2,1,0].map(o=>[day(o),S.log[day(o)]||{}]),mx=Math.max(1,...days.map(d=>xp(d[1])));
 const names=[...new Set([...Object.keys(US()),CUR])],lb=names.map(n=>{let d={};try{d=JSON.parse(localStorage.getItem('hsk4:'+n)||'{}')}catch(e){}return[n,[0,1,2,3,4,5,6].reduce((s,o)=>s+xp((d.log||{})[day(o)]||{}),0)]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
 $('m').innerHTML=`<div class="grid"><div class="card sky cloud"><div style="display:flex;gap:14px;align-items:center"><img src="img/pug.png" alt="" style="width:88px;height:88px;object-fit:contain"><div style="flex:1"><h2 style="margin:0">Góc học tập</h2><small>Cấp ${1+Math.floor(L/10)}</small><small style="float:right">${L%10}/10 từ</small><div class="bar"><div style="width:${L%10*10}%"></div></div></div></div><div class="quote">💬<span>“${QUO[qi%3]}”</span><button class="pill" onclick="qi++;go('home')">↻</button></div></div>
 <div class="card streak peach cloud"><small>🔥 CHUỖI NGÀY HỌC</small><h2>${streak()} <small style="font-size:1.1rem">ngày</small></h2><div class="wk">${['T2','T3','T4','T5','T6','T7','CN'].map((d,i)=>{const o=mon-i;return`<div>${d}<i class="${o>=0&&S.days.includes(day(o))?'on':''}"></i></div>`}).join('')}</div></div>
 <div class="card sky cloud"><div class="stat">📚 Tổng số từ<b>${A.length}</b></div><div class="stat">🌱 Đã thuộc<b>${L}</b></div><div class="stat">🥚 Chưa thuộc<b>${A.length-L}</b></div></div></div>
 <div class="card sky" style="margin-top:14px"><h3 style="margin:0 0 8px">📅 Hôm nay <small style="color:var(--mut)">${day()}</small></h3>
 <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><span>Mục tiêu mỗi ngày: <select style="width:auto" onchange="S.goal=+this.value;save();go('home')">${[5,10,20,30,50].map(n=>`<option ${S.goal==n?'selected':''}>${n}</option>`)}</select> từ</span><span><b>${t.w}</b>/${S.goal} ${t.w>=S.goal?'🎉':''}</span></div><div class="bar" style="margin:8px 0"><div style="width:${Math.min(100,t.w/S.goal*100)}%"></div></div>
 <div class="grid" style="margin:10px 0"><div class="stat">🌱 Từ mới<b>${t.w}</b></div><div class="stat">🧠 Câu đúng<b>${t.qc}/${t.qa}</b></div><div class="stat">✍️ Luyện viết<b>${t.wr}</b></div><div class="stat">⏱ Số phút<b>${t.m}</b></div><div class="stat">⭐ XP<b>${xp(t)}</b></div></div>
 <small>XP 7 ngày gần nhất</small><div class="bars">${days.map(d=>`<div><i style="height:${xp(d[1])/mx*70}px"></i>${d[0].slice(5)}<br>${xp(d[1])}</div>`).join('')}</div></div>
 <div class="card peach" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:240px"><small style="color:#7c5cd6;font-weight:800">HỌC CÙNG BẠN BÈ</small><h2 style="margin:4px 0">Bảng xếp hạng tuần</h2><div class="stat" style="font-weight:600">${lb.length?lb.map((x,i)=>`${['🥇','🥈','🥉','4.','5.'][i]} ${esc(x[0])} — ${x[1]} XP`).join('<br>'):'Tuần này chưa có XP 🌱'}</div></div><button class="cta" onclick="go('acct')">${CUR=='guest'?'Log in 登录':'👤 '+esc(CUR)}</button></div>
 <div class="tiles">${[['cards','Thẻ nhớ','golden'],['quiz','Trắc nghiệm','gears'],['notes','Ghi chú','beagle'],['add','Thêm từ','star']].map(t=>`<div class="card tile" onclick="go('${t[0]}')">${t[1]}<img src="img/${t[2]}.png" alt=""></div>`).join('')}</div>`},
vocab(){vmax=60;$('m').innerHTML=`<div class="card"><input id="s" placeholder="Tìm kiếm (chữ Hán / pinyin / nghĩa)…" oninput="vmax=60;vl()"><div id="vl"></div></div><div class="card sky"><h3 style="margin:0">✏️ Bài tập — Từ vựng</h3><div id="vp"></div><button class="cta" onclick="vp()">Bộ câu hỏi mới</button></div>`;vl();vp()},
cards(){const P=pool();if(!P.length)return $('m').innerHTML=EMPTY();const v=P[pos%P.length];
 $('m').innerHTML=`<div class="card">${note()}<small>${pos%P.length+1}/${P.length} · bấm vào thẻ để lật</small><div class="fc" onclick="flip=!flip;go('cards')">${flip?`${v.p}<br><small>${v.t||''} ${esc(v.m)}</small>`:v.w}</div>
 <button class="cta" onclick="speak('${v.w}')">🔊</button> <button class="cta" onclick="mark('${v.w}',1);pos++;flip=false;go('cards')">Đã thuộc ✓</button> <button class="cta" style="background:#8aa" onclick="pos++;flip=false;go('cards')">Học lại</button></div>`},
gram(){const q=($('gq')||{value:''}).value||'';$('m').innerHTML=`<div class="card"><input id="gq" placeholder="Tìm điểm ngữ pháp…" oninput="gs()" value="${esc(q)}"></div><div id="gl"></div>`;gs()},
quiz(){const P=pool();if(P.length<4)return $('m').innerHTML=EMPTY(4);$('m').innerHTML=`<div class="card sky">${note()}<h3 style="margin:0">🧠 Trắc nghiệm</h3><div id="qz"></div><button class="cta" onclick="go('quiz')">Bộ câu hỏi mới →</button></div>`;mcq('qz',vq(P,5))},
write(){cur=WRITE1.map(()=>[]);
 $('m').innerHTML=`<div class="card sky"><h3>Phần 1: Sắp xếp thành câu hoàn chỉnh</h3>`+WRITE1.map((x,i)=>`<div class="item"><div id="p${i}">${shuf(x.w).map(w=>`<button class="pill" style="font-size:1.2rem;margin:3px" onclick="pk(${i},this)">${w}</button>`).join('')}</div><div id="o${i}" style="min-height:36px;border-bottom:3px solid var(--acc);font-size:1.3rem"></div><button class="pill" onclick="ck(${i})">Kiểm tra</button> <button class="pill" onclick="go('write')">Làm lại</button> <span id="r${i}"></span></div>`).join('')+`</div><div class="card sky"><h3>Phần 2: Viết câu với từ cho sẵn</h3>`+WRITE2.map(x=>`<div class="item"><b style="font-size:1.4rem">${x.w}</b><textarea rows="2"></textarea><button class="pill" onclick="this.nextElementSibling.hidden=false;track('wr')">Xem câu mẫu</button><span hidden> ${x.s}</span></div>`).join('')+'</div>'},
notes(){const k=U=='all'?'general':U;$('m').innerHTML=`<div class="card"><h3>Ghi chú — ${k=='general'?'Chung':'Bài '+k}</h3><textarea rows="12" oninput="S.notes['${k}']=this.value;save()">${esc(S.notes[k]||'')}</textarea></div>`},
add(){$('m').innerHTML=`<div class="card"><h3>Thêm từ mới</h3><input id="a1" placeholder="Chữ Hán"><input id="a2" placeholder="pinyin"><input id="a3" placeholder="Nghĩa"><input id="a4" type="number" min="0" max="20" placeholder="Bài 0–20" value="0"><button class="cta" onclick="addw()">Thêm</button></div><div class="card"><h3>Nhập nhiều từ cùng lúc</h3><small>Mỗi dòng một từ: chữ Hán,pinyin,nghĩa,số bài (ngăn cách bằng dấu phẩy hoặc Tab)</small><textarea id="bulk" rows="8"></textarea><button class="cta" onclick="bulk()">Nhập</button></div>`},
acct(){const lg=CUR!='guest';$('m').innerHTML=`<div class="card">${lg?`<h3>👤 ${esc(CUR)}</h3><p>Số từ: ${all().length} · Đã thuộc: ${lc()} · Chuỗi: ${streak()} ngày · XP (7 ngày): ${[0,1,2,3,4,5,6].reduce((s,o)=>s+xp(S.log[day(o)]||{}),0)}</p><button class="cta" onclick="sw('guest')">Đăng xuất</button> `:`<h3>Đăng nhập / Đăng ký</h3><input id="un" placeholder="Tên đăng nhập"><input id="up" type="password" placeholder="Mã PIN (không bắt buộc)"><button class="cta" onclick="lgin()">Đăng nhập</button> <button class="cta" onclick="sgn()">Đăng ký</button><p>Hoặc tiếp tục học với tư cách khách.</p>`}
 <button class="cta" onclick="exp()">Xuất dữ liệu</button> <button class="cta" style="background:#c66" onclick="if(confirm('Xóa toàn bộ tiến độ của ${esc(CUR)}?')){localStorage.removeItem('hsk4:${CUR}');load();paint();go('home')}">Đặt lại</button>
 <p style="color:var(--mut);font-size:.85rem">Tài khoản chỉ lưu trong trình duyệt này (không có máy chủ): dùng để tách tiến độ khi nhiều người chung một thiết bị.</p></div>`}};
function vl(){const s=($('s')||{value:''}).value.toLowerCase(),F=pool().filter(v=>(v.w+v.p+v.m+v.t).toLowerCase().includes(s));$('vl').innerHTML=note()+`<small>${F.length} từ</small>`+F.slice(0,vmax).map(v=>`<div class="row"><span class="w">${v.w}</span><span class="m">${v.p}<br><small>${v.t||''} ${esc(v.m)}</small></span><button class="pill" onclick="speak('${v.w}')">🔊</button><button class="pill" onclick="mark('${v.w}',!S.learned['${v.w}']);vl()">${S.learned[v.w]?'✅':'⬜'}</button></div>`).join('')+(F.length>vmax?`<p><button class="cta" onclick="vmax+=60;vl()">Xem thêm</button></p>`:'')}
function vp(){const s=($('s')||{value:''}).value.toLowerCase(),F=pool().filter(v=>(v.w+v.p+v.m+v.t).toLowerCase().includes(s)).slice(0,vmax);mcq('vp',F.length>=4?vq(F,5):[])}
function gs(){const s=$('gq').value.toLowerCase(),items=GRAMMAR.filter(g=>(U=='all'||U==g[0])&&(!s||(g[1]+g[2]).toLowerCase().includes(s)));let last=0,o='';const us=[];
 const ex=u=>s?'':`<div class="card sky"><h4 style="margin:0">✏️ Bài tập — Bài ${u}: chọn từ điền vào chỗ trống</h4><div id="ex${u}"></div><button class="cta" onclick="mcq('ex${u}',cloze(${u}))">Bộ câu hỏi mới</button></div>`;
 items.forEach(g=>{if(g[0]!=last){if(last)o+=ex(last);last=g[0];us.push(last);const l=LESSONS[last-1];o+=`<h3 style="margin:18px 4px 6px">Bài ${l[0]}: ${l[1]} <small style="color:var(--mut)">${l[2]}</small></h3>`}
  o+=`<details class="card" style="padding:12px 18px;margin-bottom:8px"><summary style="font-weight:800;font-size:1.15rem;cursor:pointer">${esc(g[1])}</summary><div style="white-space:pre-wrap;line-height:1.8;margin-top:8px">${esc(g[2])}</div></details>`});
 if(last)o+=ex(last);$('gl').innerHTML=o||EMPTY();if(!s)us.forEach(u=>mcq('ex'+u,cloze(u)))}
function pk(i,b){cur[i].push(b.textContent);b.style.visibility='hidden';$('o'+i).textContent=cur[i].join('')}
function ck(i){const f=s=>s.replace(/[，。？！、\s]/g,''),ok=f(cur[i].join(''))==f(WRITE1[i].a);$('r'+i).innerHTML=ok?'✔ Chính xác':`✘ Đáp án: ${WRITE1[i].a}。`;if(ok)track('wr')}
function addw(){const a=['a1','a2','a3'].map(i=>$(i).value.trim());if(!a[0]||!a[2])return alert('Vui lòng nhập chữ Hán và nghĩa');S.mine.push([a[0],a[1],'',a[2],+$('a4').value||0]);save();alert('Đã thêm');go('add')}
function bulk(){let n=0;$('bulk').value.split('\n').forEach(l=>{const c=l.split(/[,\t]/).map(x=>x.trim());if(c[0]&&c[2]){S.mine.push([c[0],c[1]||'','',c[2],+c[3]||0]);n++}});save();alert(n+' từ đã được nhập');go('add')}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='hsk4-progress.json';a.click()}
function sw(n){save();CUR=n;localStorage.setItem('hsk4_cur',n);load();U='all';paint();go('home')}
function sgn(){const n=$('un').value.trim(),u=US();if(!n||n=='guest'||/[<>"'\\]/.test(n))return alert('Tên không hợp lệ');if(u[n])return alert('Tên đã tồn tại');u[n]={pin:$('up').value};localStorage.setItem('hsk4_users',JSON.stringify(u));sw(n)}
function lgin(){const n=$('un').value.trim(),u=US();if(!u[n]||u[n].pin!=$('up').value)return alert('Sai tên hoặc mã PIN');sw(n)}
paint();go('home');
</script></body></html>
