<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tự học HSK4</title>

<style>
:root{--tx:#1f2a44;--mut:#5b6785;--card:#fff;--peach:#f6f2ef;--peachb:#e2d9d2;--sky:#f3f6fb;--skyb:#d3dcea;--grey:#c9d2e0;--lav:#c9d1ee;--acc:#3f5a9d;--w:#fff}
body{margin:0;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;font-weight:500;padding-bottom:90px;background:#f4f7fb}
body.t1{background:#f7f5f0}body.t2{background:#eff4f2}
.hz{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,serif;font-weight:600}
*{box-sizing:border-box}button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-weight:700}
header{display:flex;gap:10px;align-items:center;padding:10px 18px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--skyb)}
.logo{font-weight:700;font-size:1.25rem;margin-right:auto;display:flex;gap:10px;align-items:center}.sq{background:var(--acc);color:#fff;border-radius:8px;padding:2px 9px;font-family:"Noto Serif SC",serif}
.bub{border:1px solid var(--skyb);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--tx)}
main{max-width:1050px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--skyb);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px #1f2a4414}
.sky{background:var(--sky)}.peach{background:var(--peach);border-color:var(--peachb)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.grid .card{margin:0}
.streak h2{font-size:2.8rem;margin:0;color:var(--acc)}
.wk{display:flex;justify-content:space-between;font-size:.8rem;margin-top:12px}.wk i{display:block;width:26px;height:26px;border-radius:50%;border:2px solid var(--grey);margin:4px auto;background:#fff}.wk i.on{background:var(--acc);border-color:var(--acc)}
.bar{height:10px;background:#e8edf5;border-radius:6px;overflow:hidden}.bar div{height:100%;background:var(--acc)}
.stat{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--skyb);border-radius:10px;padding:10px 16px;margin-bottom:8px;font-weight:600}.stat b{font-size:1.5rem;color:var(--acc)}
.quote{background:#fff;border:1px solid var(--skyb);border-radius:10px;padding:12px 16px;display:flex;gap:10px;align-items:center;margin-top:12px}.quote span{flex:1}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:14px}.tile{cursor:pointer;font-weight:700;font-size:1.05rem;margin:0;border-left:4px solid var(--acc)}
.cta{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 18px;font-weight:600;cursor:pointer}
.pill{border:1px solid var(--skyb);background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:600}
.fc{font-size:2.8rem;text-align:center;padding:46px 10px;cursor:pointer;background:#fff;border:1px solid var(--skyb);border-radius:12px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--skyb)}.row .w{font-size:1.5rem;min-width:100px}.row .m{flex:1}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border:1px solid var(--skyb);border-radius:8px;background:#fff;cursor:pointer;font-weight:500}
.sel{background:#e4ebf8!important;border-color:var(--acc)!important}.qn{font-weight:700;color:var(--acc);margin-top:6px}
.ok{background:#e0f3e8!important;border-color:#3a9a62!important}.no{background:#fbe3e3!important;border-color:#cc6b6b!important}
.item{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--skyb)}.qq{font-size:1.15rem;margin-bottom:6px}
input,textarea,select{background:#fff;border:1px solid var(--skyb);border-radius:8px;padding:8px 12px;width:100%;margin:4px 0}
select.bub{width:auto;max-width:90vw}
.bars{display:flex;gap:8px;align-items:flex-end;height:100px}.bars div{flex:1;text-align:center;font-size:.72rem}.bars i{display:block;background:var(--acc);border-radius:4px 4px 0 0;min-height:4px;margin-bottom:2px;opacity:.85}
.hzg{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));margin:12px 0}
.hzt{position:relative;border:1px solid #0000001a;border-radius:10px;padding:12px 8px 10px;text-align:center;cursor:pointer;min-height:132px}
.hzt:hover{box-shadow:0 2px 8px #1f2a4422}.hzc{font-size:2.6rem;line-height:1.2}.hzm{font-size:.85rem;color:var(--tx);margin-top:4px}.hzi{position:absolute;top:6px;right:8px;font-size:1rem;opacity:.55;filter:grayscale(1)}.hzk{position:absolute;top:6px;left:8px;color:#2f8a57;font-weight:700}
nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--skyb);border-radius:12px;padding:4px;display:flex;gap:2px;box-shadow:0 4px 18px #1f2a4426;max-width:97vw;overflow-x:auto}
nav button{border:0;background:none;border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--mut);font-size:.72rem;font-weight:600;white-space:nowrap}nav button span{display:block;font-size:1.3rem;font-family:"Noto Serif SC","Songti SC",serif;color:var(--tx)}
nav button.on{background:#e8eef8;color:var(--acc)}nav button.on span{color:var(--acc)}
</style></head><body>
<header><div class="logo"><span class="sq">汉</span> Tự học HSK4</div>
<button class="bub" onclick="S.th=((S.th||0)+1)%3;save();paint()" title="Đổi tông nền">Nền</button>
<span><button class="bub" onclick="fs(-10)">A-</button> <b id="fz"></b> <button class="bub" onclick="fs(10)">A+</button></span>
<select class="bub" id="unit" onchange="U=this.value;pos=0;go(V)"></select>
<button class="bub" onclick="go('notes')" title="Ghi chú">Ghi chú</button><button class="bub" onclick="go('acct')" id="usr">Đăng nhập</button></header>
<main id="m"></main><nav id="nav"></nav>
<script src="data.js"></script><script src="vocab_data.js"></script><script src="grammar_data.js"></script><script src="exam_data.js"></script><script src="exam_tests.js"></script><script src="hanzi_data.js"></script>
<script>

const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()-o);return d.toISOString().slice(0,10)};
const US=()=>{try{return JSON.parse(localStorage.getItem('hsk4_users')||'{}')}catch(e){return{}}};
let CUR=localStorage.getItem('hsk4_cur')||'guest',S;
function load(){S={learned:{},mine:[],notes:{},days:[],log:{},goal:10,dark:false,font:100};try{Object.assign(S,JSON.parse(localStorage.getItem('hsk4:'+CUR)||(CUR=='guest'?localStorage.getItem('hsk4'):null)||'{}'))}catch(e){}}
const save=()=>{try{localStorage.setItem('hsk4:'+CUR,JSON.stringify(S))}catch(e){}};
load();
let U='all',V='home',pos=0,flip=false,sc=[0,0],cur=[],qi=0,vmax=60,lastAct=Date.now();const MQ={};
const T=()=>S.log[day()]||(S.log[day()]={w:0,qa:0,qc:0,wr:0,m:0});
const touch=()=>{if(!S.days.includes(day()))S.days.push(day())};
function track(k,n=1){T()[k]+=n;touch();save()}
const xp=l=>(l.w||0)*5+(l.qc||0)*2+(l.wr||0)*3;
function mark(w,v){if(v&&!S.learned[w])track('w');S.learned[w]=v?1:0;save()}
const all=()=>[...VOCAB,...S.mine].map(a=>({w:a[0],p:a[1],t:a[2],m:a[3],u:+a[4]}));
const pool=()=>{const p=all().filter(v=>U=='all'||v.u==U);return p.length?p:all()};
const note=()=>(U!='all'&&!all().some(v=>v.u==U))?`<p style="color:var(--mut)">Từ vựng chưa được chia theo bài — đang hiển thị toàn bộ danh sách.</p>`:'';
const streak=()=>{let n=0,o=S.days.includes(day())?0:1;while(S.days.includes(day(o))){n++;o++}return n};
const speak=w=>{try{const u=new SpeechSynthesisUtterance(w);u.lang='zh-CN';speechSynthesis.speak(u)}catch(e){}};
const shuf=a=>[...a].sort(()=>Math.random()-.5);
addEventListener('click',()=>lastAct=Date.now());addEventListener('keydown',()=>lastAct=Date.now());
setInterval(()=>{if(!document.hidden&&Date.now()-lastAct<120000){T().m++;save()}},60000);
function fs(d){S.font=Math.max(80,Math.min(160,S.font+d));save();paint()}
const NAV=[['home','首','Trang chủ'],['vocab','词','Từ vựng'],['cards','卡','Thẻ nhớ'],['hanzi','字','Chữ hình'],['gram','法','Ngữ pháp'],['quiz','测','Trắc nghiệm'],['exam','考','Luyện thi'],['notes','记','Ghi chú'],['add','增','Thêm từ'],['acct','我','Tài khoản']];
function paint(){document.body.className='t'+(S.th||0);document.documentElement.style.fontSize=S.font+'%';$('fz').textContent=S.font+'%';$('usr').textContent=(CUR=='guest'?'Đăng nhập':'Tài khoản: '+CUR);
 $('unit').innerHTML='<option value="all">Tất cả các bài</option><option value="0">Danh sách từ</option>'+LESSONS.map(l=>`<option value="${l[0]}">Bài ${l[0]}: ${l[1]} — ${l[2]}</option>`).join('');$('unit').value=U;
 $('nav').innerHTML=NAV.map(n=>`<button class="${V==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}
function go(v){V=v;paint();R[v]();scrollTo(0,0)}
const lc=()=>all().filter(v=>S.learned[v.w]).length;
const EMPTY=(n=1)=>`<div class="card">Chưa có từ nào (cần tối thiểu ${n} từ).</div>`;
// ---- generic multiple choice ----
function mcq(id,qs){MQ[id]=qs;$(id).innerHTML=qs.map((x,i)=>`<div class="item"><div class="qq">${x.q}</div>${x.o.map((o,j)=>`<button class="opt" onclick="pa('${id}',${i},${j},this)">${esc(o)}</button>`).join('')}</div>`).join('')||'<small>Phần này chưa có bài tập.</small>'}
function pa(id,i,j,b){const x=MQ[id][i];if(x.d)return;x.d=1;const ok=x.o[j]==x.a;track('qa');if(ok){track('qc');if(x.w)mark(x.w,1)}b.classList.add(ok?'ok':'no');if(!ok)[...b.parentNode.querySelectorAll('.opt')].find(e=>e.textContent==x.a).classList.add('ok');if(x.why)b.parentNode.insertAdjacentHTML('beforeend','<p>'+x.why+'</p>')}
function vq(list,n){const P=all();return shuf(list).slice(0,n).map(v=>({q:`<b style="font-size:1.7rem">${v.w}</b>`,a:v.m,w:v.w,o:shuf([v.m,...shuf(P.filter(x=>x.m!=v.m)).slice(0,3).map(x=>x.m)])}))}
function keyOf(h){const m=(h.match(/^[^A-Za-z\u00C0-\u1EF9]*/)||[''])[0];return m.split(/[。\.…\+\s\/（）()，,]+/).filter(x=>/[\u4e00-\u9fff]/.test(x)).sort((a,b)=>b.length-a.length)[0]||''}
function cloze(u){const pts=GRAMMAR.filter(g=>g[0]==u),keys=pts.map(g=>keyOf(g[1])),allk=[...new Set(GRAMMAR.map(g=>keyOf(g[1])).filter(Boolean))],qs=[];
 pts.forEach((g,i)=>{const k=keys[i];if(!k)return;const ss=g[2].split('\n').flatMap(l=>l.split(/(?<=[。？！])/)).map(s=>s.replace(/^[AB][：:]\s*/,'').trim()).filter(s=>/^[\u4e00-\u9fff，。？！、“”：；（）·…—\s]+$/.test(s)&&s.length>=8&&s.length<=45&&s.split(k).length==2);
  if(!ss.length)return;const s=shuf(ss)[0],d=shuf([...keys.filter(x=>x&&x!=k&&!x.includes(k)&&!k.includes(x)),...shuf(allk).filter(x=>!x.includes(k)&&!k.includes(x))]).filter((x,j,a)=>a.indexOf(x)==j).slice(0,3);
  qs.push({q:s.replace(k,'<b>＿＿＿</b>')+` <small style="color:var(--mut)">(${esc(g[1].split(' ')[0])})</small>`,a:k,o:shuf([k,...d])})});return qs}
const R={
home(){const A=all(),L=lc(),QUO=["Một ngôn ngữ khác là một cách nhìn cuộc sống khác. — Federico Fellini","Hành trình ngàn dặm bắt đầu từ một bước chân. — Lão Tử","Học rồi thường xuyên ôn tập, chẳng phải là niềm vui sao? — Khổng Tử"],
 mon=(new Date().getDay()+6)%7,t=T(),days=[6,5,4,3,2,1,0].map(o=>[day(o),S.log[day(o)]||{}]),mx=Math.max(1,...days.map(d=>xp(d[1])));
 const names=[...new Set([...Object.keys(US()),CUR])],lb=names.map(n=>{let d={};try{d=JSON.parse(localStorage.getItem('hsk4:'+n)||'{}')}catch(e){}return[n,[0,1,2,3,4,5,6].reduce((s,o)=>s+xp((d.log||{})[day(o)]||{}),0)]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
 $('m').innerHTML=`<div class="grid"><div class="card sky"><div style="display:flex;gap:14px;align-items:center"><div class="sq" style="font-size:2rem;padding:8px 18px">汉</div><div style="flex:1"><h2 style="margin:0">Góc học tập</h2><small>Cấp ${1+Math.floor(L/10)}</small><small style="float:right">${L%10}/10 từ</small><div class="bar"><div style="width:${L%10*10}%"></div></div></div></div><div class="quote">Giải thích:<span>“${QUO[qi%3]}”</span><button class="pill" onclick="qi++;go('home')">↻</button></div></div>
 <div class="card streak"><small>CHUỖI NGÀY HỌC</small><h2>${streak()} <small style="font-size:1.1rem">ngày</small></h2><div class="wk">${['T2','T3','T4','T5','T6','T7','CN'].map((d,i)=>{const o=mon-i;return`<div>${d}<i class="${o>=0&&S.days.includes(day(o))?'on':''}"></i></div>`}).join('')}</div></div>
 <div class="card sky"><div class="stat">Tổng số từ<b>${A.length}</b></div><div class="stat">Đã thuộc<b>${L}</b></div><div class="stat">Chưa thuộc<b>${A.length-L}</b></div></div></div>
 <div class="card sky" style="margin-top:14px"><h3 style="margin:0 0 8px">Hôm nay <small style="color:var(--mut)">${day()}</small></h3>
 <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><span>Mục tiêu mỗi ngày: <select style="width:auto" onchange="S.goal=+this.value;save();go('home')">${[5,10,20,30,50].map(n=>`<option ${S.goal==n?'selected':''}>${n}</option>`)}</select> từ</span><span><b>${t.w}</b>/${S.goal} ${t.w>=S.goal?'(đạt)':''}</span></div><div class="bar" style="margin:8px 0"><div style="width:${Math.min(100,t.w/S.goal*100)}%"></div></div>
 <div class="grid" style="margin:10px 0"><div class="stat">Từ mới<b>${t.w}</b></div><div class="stat">Câu đúng<b>${t.qc}/${t.qa}</b></div><div class="stat">Luyện viết<b>${t.wr}</b></div><div class="stat">Số phút<b>${t.m}</b></div><div class="stat">XP<b>${xp(t)}</b></div></div>
 <small>XP 7 ngày gần nhất</small><div class="bars">${days.map(d=>`<div><i style="height:${xp(d[1])/mx*70}px"></i>${d[0].slice(5)}<br>${xp(d[1])}</div>`).join('')}</div></div>
 <div class="card peach" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:240px"><small style="color:#7c5cd6;font-weight:800">HỌC CÙNG BẠN BÈ</small><h2 style="margin:4px 0">Bảng xếp hạng tuần</h2><div class="stat" style="font-weight:600">${lb.length?lb.map((x,i)=>`${['1.','2.','3.','4.','5.'][i]} ${esc(x[0])} — ${x[1]} XP`).join('<br>'):'Tuần này chưa có XP'}</div></div><button class="cta" onclick="go('acct')">${CUR=='guest'?'Log in 登录':''+esc(CUR)}</button></div>
 <div class="tiles">${[['cards','Thẻ nhớ'],['hanzi','Nhớ chữ tượng hình'],['quiz','Trắc nghiệm'],['exam','Luyện thi HSK4'],['notes','Ghi chú']].map(t=>`<div class="card tile" onclick="go('${t[0]}')">${t[1]}</div>`).join('')}</div>`},
vocab(){vmax=60;$('m').innerHTML=`<div class="card"><input id="s" placeholder="Tìm kiếm (chữ Hán / pinyin / nghĩa)…" oninput="vmax=60;vl()"><div id="vl"></div></div><div class="card sky"><h3 style="margin:0">Bài tập — Từ vựng</h3><div id="vp"></div><button class="cta" onclick="vp()">Bộ câu hỏi mới</button></div>`;vl();vp()},
cards(){const P=pool();if(!P.length)return $('m').innerHTML=EMPTY();const v=P[pos%P.length];
 $('m').innerHTML=`<div class="card">${note()}<small>${pos%P.length+1}/${P.length} · bấm vào thẻ để lật</small><div class="fc" onclick="flip=!flip;go('cards')">${flip?`${v.p}<br><small>${v.t||''} ${esc(v.m)}</small>`:v.w}</div>
 <button class="cta" onclick="speak('${v.w}')">Nghe</button> <button class="cta" onclick="mark('${v.w}',1);pos++;flip=false;go('cards')">Đã thuộc ✓</button> <button class="cta" style="background:#8aa" onclick="pos++;flip=false;go('cards')">Học lại</button></div>`},
gram(){const q=($('gq')||{value:''}).value||'';$('m').innerHTML=`<div class="card"><input id="gq" placeholder="Tìm điểm ngữ pháp…" oninput="gs()" value="${esc(q)}"></div><div id="gl"></div>`;gs()},
quiz(){const P=pool();if(P.length<4)return $('m').innerHTML=EMPTY(4);$('m').innerHTML=`<div class="card sky">${note()}<h3 style="margin:0">Trắc nghiệm</h3><div id="qz"></div><button class="cta" onclick="go('quiz')">Bộ câu hỏi mới →</button></div>`;mcq('qz',vq(P,5))},
hanzi(){S.hz=S.hz||{};const L=HANZI.filter(h=>HZC=='all'||h[2]==HZC),n=HANZI.filter(h=>S.hz[h[0]]).length;
 $('m').innerHTML=`<div class="card sky"><h2 style="margin:0">Nhớ chữ Hán qua hình ảnh</h2><p>Nhiều chữ Hán bắt nguồn từ một hình vẽ hoặc một ý dễ hình dung. Bấm vào từng ô để xem cách nhớ và các từ HSK4 chứa chữ đó. Các cách nhớ chỉ mang tính gợi ý, không phải lúc nào cũng là nguồn gốc học thuật.</p><small>Đã nhớ ${n}/${HANZI.length} chữ</small><div class="bar" style="margin:6px 0 12px"><div style="width:${n/HANZI.length*100}%"></div></div>
 <button class="pill" onclick="HZC='all';go('hanzi')">Tất cả</button> ${Object.keys(HZCAT).map(k=>`<button class="pill" onclick="HZC='${k}';go('hanzi')">${HZCAT[k][0]}</button>`).join(' ')}</div>
 <div id="hzd"></div><div class="hzg">${L.map(h=>`<div class="hzt" style="background:${HZCAT[h[2]][1]}" onclick="hzf('${h[0]}')"><span class="hzi">${h[3]}</span>${S.hz[h[0]]?'<span class="hzk">✓</span>':''}<div class="hzc hz">${h[0]}</div><div class="hzm">${h[1]}</div></div>`).join('')}</div>
 <div class="card sky"><h3 style="margin-top:0">Bài tập: nhận biết chữ qua hình ảnh</h3><div id="hzq"></div><button class="cta" onclick="hzq()">Bộ câu hỏi mới</button></div>`;hzq()},
exam(){const li=a=>a.map(t=>`<li style="margin:4px 0">${t}</li>`).join(''),T_=S.tests||{};
 let o=`<div class="card sky"><h2 style="margin:0">Luyện thi HSK4: Viết &amp; Đọc</h2><p>Học từng dạng bài theo 4 bước, rồi làm các bộ đề thi thử (10 đề, mỗi đề 20 câu).</p><button class="cta" onclick="EXM='learn';go('exam')">Học dạng bài</button> <button class="cta" onclick="EXM='list';go('exam')">Đề thi thử</button></div>`;
 if(EXM=='list')o+=`<div class="card"><h3 style="margin-top:0">10 đề thi thử — mỗi đề 20 câu</h3><div class="tiles" style="margin-top:0">${TESTS.map((t,n)=>`<div class="card sky tile" style="min-height:80px;padding-right:18px" onclick="TN=${n};EXM='run';go('exam')">Đề số ${n+1}<br><small>${T_[n]?`Điểm cao nhất: ${T_[n].best}/20`:'Chưa làm'}</small></div>`).join('')}</div></div>`;
 else if(EXM=='run'){const t=TESTS[TN];let k=0;o+=`<div id="tres"></div><div class="card"><h2 style="margin:0">${t.title}</h2><small>20 câu · làm hết rồi bấm “Nộp bài” để chấm điểm. Câu xếp cụm từ có thể có cách xếp hợp lý khác; đáp án là câu gốc trong giáo trình.</small></div>`+
  t.parts.map((p,pi)=>`<div class="card"><h3 style="margin-top:0">${p.name}</h3>${p.q.map((q,j)=>`<div class="qn">Câu ${++k}</div>`+qh(`t${TN}_${pi}_${j}`,q,'test')).join('')}</div>`).join('')+`<p style="text-align:center"><button class="cta" id="subb" onclick="submitTest(${TN})">Nộp bài</button></p>`}
 else o+=EXAM.map((s,i)=>{if(EXF!='all'&&EXF!=s.part)return'';const items=[nq(s.c),...(EXTRA[i]||[])];return `<div class="card"><small>${s.part=='Viết'?'PHẦN VIẾT':'PHẦN ĐỌC'} · Dạng ${i+1}</small><h2 style="margin:4px 0 10px">${s.title}</h2>
 <h3>💡 GIẢI THÍCH BÌNH DÂN</h3><ul>${li(s.g)}</ul><h3>⚠️ ĐIỂM DỄ SAI</h3><ul>${li(s.e)}</ul><h3>🏃 VÍ DỤ THỰC TẾ</h3>
 ${s.x.map(x=>`<div class="stat" style="display:block;font-weight:700"><small>${x[0]}</small><br><span style="font-size:1.35rem">${x[1]}</span><br><small>${x[2]}</small><br>→ ${x[3]}</div>`).join('')}
 <div class="card sky" style="margin:12px 0 0"><h3 style="margin-top:0">📝 THỬ THÁCH NHỎ (${items.length} câu)</h3>${items.map((q,j)=>`<div class="qn">Câu ${j+1}</div>`+qh(`s${i}_${j}`,q,'learn')).join('')}</div></div>`}).join('');
 $('m').innerHTML=o},
write(){cur=WRITE1.map(()=>[]);
 $('m').innerHTML=`<div class="card sky"><h3>Phần 1: Sắp xếp thành câu hoàn chỉnh</h3>`+WRITE1.map((x,i)=>`<div class="item"><div id="p${i}">${shuf(x.w).map(w=>`<button class="pill" style="font-size:1.2rem;margin:3px" onclick="pk(${i},this)">${w}</button>`).join('')}</div><div id="o${i}" style="min-height:36px;border-bottom:3px solid var(--acc);font-size:1.3rem"></div><button class="pill" onclick="ck(${i})">Kiểm tra</button> <button class="pill" onclick="go('write')">Làm lại</button> <span id="r${i}"></span></div>`).join('')+`</div><div class="card sky"><h3>Phần 2: Viết câu với từ cho sẵn</h3>`+WRITE2.map(x=>`<div class="item"><b style="font-size:1.4rem">${x.w}</b><textarea rows="2"></textarea><button class="pill" onclick="this.nextElementSibling.hidden=false;track('wr')">Xem câu mẫu</button><span hidden> ${x.s}</span></div>`).join('')+'</div>'},
notes(){const k=U=='all'?'general':U;$('m').innerHTML=`<div class="card"><h3>Ghi chú — ${k=='general'?'Chung':'Bài '+k}</h3><textarea rows="12" oninput="S.notes['${k}']=this.value;save()">${esc(S.notes[k]||'')}</textarea></div>`},
add(){$('m').innerHTML=`<div class="card"><h3>Thêm từ mới</h3><input id="a1" placeholder="Chữ Hán"><input id="a2" placeholder="pinyin"><input id="a3" placeholder="Nghĩa"><input id="a4" type="number" min="0" max="20" placeholder="Bài 0–20" value="0"><button class="cta" onclick="addw()">Thêm</button></div><div class="card"><h3>Nhập nhiều từ cùng lúc</h3><small>Mỗi dòng một từ: chữ Hán,pinyin,nghĩa,số bài (ngăn cách bằng dấu phẩy hoặc Tab)</small><textarea id="bulk" rows="8"></textarea><button class="cta" onclick="bulk()">Nhập</button></div>`},
acct(){const lg=CUR!='guest';$('m').innerHTML=`<div class="card">${lg?`<h3>${esc(CUR)}</h3><p>Số từ: ${all().length} · Đã thuộc: ${lc()} · Chuỗi: ${streak()} ngày · XP (7 ngày): ${[0,1,2,3,4,5,6].reduce((s,o)=>s+xp(S.log[day(o)]||{}),0)}</p><button class="cta" onclick="sw('guest')">Đăng xuất</button> `:`<h3>Đăng nhập / Đăng ký</h3><input id="un" placeholder="Tên đăng nhập"><input id="up" type="password" placeholder="Mã PIN (không bắt buộc)"><button class="cta" onclick="lgin()">Đăng nhập</button> <button class="cta" onclick="sgn()">Đăng ký</button><p>Hoặc tiếp tục học với tư cách khách.</p>`}
 <button class="cta" onclick="exp()">Xuất dữ liệu</button> <button class="cta" style="background:#c66" onclick="if(confirm('Xóa toàn bộ tiến độ của ${esc(CUR)}?')){localStorage.removeItem('hsk4:${CUR}');load();paint();go('home')}">Đặt lại</button>
 <p style="color:var(--mut);font-size:.85rem">Tài khoản chỉ lưu trong trình duyệt này (không có máy chủ): dùng để tách tiến độ khi nhiều người chung một thiết bị.</p></div>`}};
function vl(){const s=($('s')||{value:''}).value.toLowerCase(),F=pool().filter(v=>(v.w+v.p+v.m+v.t).toLowerCase().includes(s));$('vl').innerHTML=note()+`<small>${F.length} từ</small>`+F.slice(0,vmax).map(v=>`<div class="row"><span class="w">${v.w}</span><span class="m">${v.p}<br><small>${v.t||''} ${esc(v.m)}</small></span><button class="pill" onclick="speak('${v.w}')">Nghe</button><button class="pill" onclick="mark('${v.w}',!S.learned['${v.w}']);vl()">${S.learned[v.w]?'✓ Đã thuộc':'Chưa thuộc'}</button></div>`).join('')+(F.length>vmax?`<p><button class="cta" onclick="vmax+=60;vl()">Xem thêm</button></p>`:'')}
function vp(){const s=($('s')||{value:''}).value.toLowerCase(),F=pool().filter(v=>(v.w+v.p+v.m+v.t).toLowerCase().includes(s)).slice(0,vmax);mcq('vp',F.length>=4?vq(F,5):[])}
function gs(){const s=$('gq').value.toLowerCase(),items=GRAMMAR.filter(g=>(U=='all'||U==g[0])&&(!s||(g[1]+g[2]).toLowerCase().includes(s)));let last=0,o='';const us=[];
 const ex=u=>s?'':`<div class="card sky"><h4 style="margin:0">Bài tập — Bài ${u}: chọn từ điền vào chỗ trống</h4><div id="ex${u}"></div><button class="cta" onclick="mcq('ex${u}',cloze(${u}))">Bộ câu hỏi mới</button></div>`;
 items.forEach(g=>{if(g[0]!=last){if(last)o+=ex(last);last=g[0];us.push(last);const l=LESSONS[last-1];o+=`<h3 style="margin:18px 4px 6px">Bài ${l[0]}: ${l[1]} <small style="color:var(--mut)">${l[2]}</small></h3>`}
  o+=`<details class="card" style="padding:12px 18px;margin-bottom:8px"><summary style="font-weight:800;font-size:1.15rem;cursor:pointer">${esc(g[1])}</summary><div style="white-space:pre-wrap;line-height:1.8;margin-top:8px">${esc(g[2])}</div></details>`});
 if(last)o+=ex(last);$('gl').innerHTML=o||EMPTY();if(!s)us.forEach(u=>mcq('ex'+u,cloze(u)))}
let HZC='all';const HZCAT={tn:['Thiên nhiên','#e4edf7'],ng:['Con người & cơ thể','#f3ece4'],dv:['Động vật','#e9f0e4'],gh:['Ghép chữ','#ece8f4'],vd:['Vật dụng & khác','#eeeeee']};
function hzf(ch){const h=HANZI.find(x=>x[0]==ch),w=VOCAB.filter(v=>v[0].includes(ch)).slice(0,5);S.hz=S.hz||{};
 $('hzd').innerHTML=`<div class="card" style="background:${HZCAT[h[2]][1]}"><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="hz" style="font-size:5.5rem;line-height:1">${ch}</div><div style="flex:1;min-width:230px"><h3 style="margin:0">${h[1]}</h3><p style="margin:6px 0"><b>Hình dung:</b> ${h[4]}</p><p style="margin:6px 0">${h[5]}</p><p style="margin:6px 0"><b>Từ HSK4 chứa chữ này:</b> ${w.length?w.map(v=>`${v[0]} (${v[1]}): ${esc(v[3])}`).join('; '):'chưa có trong danh sách'}</p><button class="cta" onclick="S.hz['${ch}']=!S.hz['${ch}'];save();go('hanzi');hzf('${ch}')">${S.hz[ch]?'Bỏ đánh dấu':'Đánh dấu đã nhớ'}</button> <button class="pill" onclick="speak('${ch}')">Nghe</button></div></div></div>`;$('hzd').scrollIntoView&&$('hzd').scrollIntoView({behavior:'smooth',block:'start'})}
function hzq(){const qs=shuf(HANZI).slice(0,8).map((h,i)=>i%2?{q:`Chữ <b class="hz" style="font-size:2rem">${h[0]}</b> có nghĩa là gì?`,a:h[1],o:shuf([h[1],...shuf(HANZI.filter(x=>x[1]!=h[1])).slice(0,3).map(x=>x[1])]),why:h[5]}:{q:`Gợi ý hình: <b>${h[4]}</b>. Đó là chữ nào?`,a:h[0],o:shuf([h[0],...shuf(HANZI.filter(x=>x[0]!=h[0])).sort((a,b)=>(b[2]==h[2])-(a[2]==h[2])).slice(0,3).map(x=>x[0])]),why:h[1]+': '+h[5]});mcq('hzq',qs)}
let EXF='all',EXM='learn',TN=0;const QD={},QM={},QS={},QX={};
const nq=c=>c.type=='order'?{t:'order',w:c.w,a:c.a,why:c.why}:c.type=='free'?{t:'free',q:c.q,m:c.m}:{t:'mcq',q:c.q,o:c.o,a:c.a,why:c.why};
const nm=s=>s.replace(/[，。？！、\s]/g,'');
function qh(id,q,mode){QD[id]=q;QM[id]=mode;QS[id]=q.t=='order'?[]:null;delete QX[id];const fb='<p class="fb" style="margin:6px 0"></p>';
 if(q.t=='mcq')return `<div class="item" id="${id}"><div class="qq">${q.q}</div>${q.o.map((o,j)=>`<button class="opt" onclick="qa_('${id}',${j},this)">${esc(o)}</button>`).join('')}${fb}</div>`;
 if(q.t=='order')return `<div class="item" id="${id}"><div class="qq">Xếp các cụm từ thành câu hoàn chỉnh:</div><div class="pl">${shuf(q.w).map(w=>`<button class="pill" style="font-size:1.15rem;margin:3px" onclick="qo_('${id}',this)">${w}</button>`).join('')}</div><div class="ou" style="min-height:36px;border-bottom:3px solid var(--acc);font-size:1.3rem"></div>${mode=='learn'?`<button class="pill" onclick="qk_('${id}')">Kiểm tra</button> `:''}<button class="pill" onclick="qr_('${id}')">Làm lại</button>${fb}</div>`;
 return `<div class="item" id="${id}"><div class="qq">${q.q}</div><textarea rows="2"></textarea><label style="display:block;margin:4px 0"><input type="checkbox" style="width:auto" onchange="if(this.checked&&QM['${id}']=='learn')track('wr')"> Mình tự chấm: đã viết đúng</label>${mode=='learn'?`<button class="pill" onclick="qm_('${id}')">Xem câu mẫu</button>`:''}<p class="fb" hidden style="margin:6px 0">Câu mẫu: <b>${q.m}</b></p></div>`}
function qa_(id,j,b){const q=QD[id],el=$(id);if(QX[id])return;
 if(QM[id]=='test'){QS[id]=j;el.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');return}
 QX[id]=1;const ok=q.o[j]==q.a;track('qa');if(ok)track('qc');gr_(id,ok,j)}
function gr_(id,ok,j){const q=QD[id],el=$(id),f=el.querySelector('.fb');el.querySelectorAll('.opt').forEach((x,k)=>{if(x.textContent==q.a)x.classList.add('ok');else if(k==j)x.classList.add('no')});f.innerHTML=(ok?'✔ Chính xác! ':'✘ Chưa đúng. ')+(q.why?''+q.why:'')}
function qo_(id,b){QS[id].push(b.textContent);b.style.visibility='hidden';$(id).querySelector('.ou').textContent=QS[id].join('')}
function qr_(id){QS[id]=[];const el=$(id);el.querySelector('.ou').textContent='';el.querySelector('.fb').textContent='';el.querySelectorAll('.pl button').forEach(b=>b.style.visibility='visible')}
function ok_o(id){return nm(QS[id].join(''))==nm(QD[id].a)}
function qk_(id){const q=QD[id],ok=ok_o(id);$(id).querySelector('.fb').innerHTML=(ok?'✔ Chính xác! ':'✘ Đáp án: '+q.a+'。 ')+(q.why?''+q.why:'');if(!QX[id]){QX[id]=1;track('qa');if(ok){track('qc');track('wr')}}}
function qm_(id){$(id).querySelector('.fb').hidden=false}
function submitTest(n){if(QX['T'+n])return;QX['T'+n]=1;let sc=0,k=0;
 TESTS[n].parts.forEach((p,pi)=>p.q.forEach((q,j)=>{const id=`t${n}_${pi}_${j}`,el=$(id);let ok=false;
  if(q.t=='mcq'){ok=QS[id]!=null&&q.o[QS[id]]==q.a;gr_(id,ok,QS[id])}
  else if(q.t=='order'){ok=ok_o(id);el.querySelector('.fb').innerHTML=(ok?'✔ Chính xác! ':'✘ Đáp án: '+q.a+'。 ')+(q.why?''+q.why:'')}
  else{ok=el.querySelector('input[type=checkbox]').checked;el.querySelector('.fb').hidden=false}
  if(ok)sc++;k++}));
 S.tests=S.tests||{};const o=S.tests[n]||{best:0};S.tests[n]={best:Math.max(o.best,sc),last:sc,date:day()};track('qa',20);track('qc',sc);track('wr',0);save();
 $('tres').innerHTML=`<div class="card peach"><h2 style="margin:0">Điểm của bạn: ${sc}/20</h2><p>${sc>=16?'Tuyệt vời! Bạn đã nắm rất chắc phần này.':sc>=10?'Khá tốt! Xem lại các câu sai (có giải thích bên dưới) rồi làm lại nhé.':'Đừng nản! Học lại dạng bài ở tab “Học dạng bài” rồi thử lại.'}</p><button class="cta" onclick="EXM='run';go('exam')">Làm lại đề này</button> <button class="cta" onclick="EXM='list';go('exam')">Chọn đề khác</button></div>`;
 $('subb').disabled=true;scrollTo(0,0)}
function pk(i,b){cur[i].push(b.textContent);b.style.visibility='hidden';$('o'+i).textContent=cur[i].join('')}
function ck(i){const f=s=>s.replace(/[，。？！、\s]/g,''),ok=f(cur[i].join(''))==f(WRITE1[i].a);$('r'+i).innerHTML=ok?'✔ Chính xác':`✘ Đáp án: ${WRITE1[i].a}。`;if(ok)track('wr')}
function addw(){const a=['a1','a2','a3'].map(i=>$(i).value.trim());if(!a[0]||!a[2])return alert('Vui lòng nhập chữ Hán và nghĩa');S.mine.push([a[0],a[1],'',a[2],+$('a4').value||0]);save();alert('Đã thêm');go('add')}
function bulk(){let n=0;$('bulk').value.split('\n').forEach(l=>{const c=l.split(/[,\t]/).map(x=>x.trim());if(c[0]&&c[2]){S.mine.push([c[0],c[1]||'','',c[2],+c[3]||0]);n++}});save();alert(n+' từ đã được nhập');go('add')}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='hsk4-progress.json';a.click()}
function sw(n){save();CUR=n;localStorage.setItem('hsk4_cur',n);load();U='all';paint();go('home')}
function sgn(){const n=$('un').value.trim(),u=US();if(!n||n=='guest'||/[<>"'\\]/.test(n))return alert('Tên không hợp lệ');if(u[n])return alert('Tên đã tồn tại');u[n]={pin:$('up').value};localStorage.setItem('hsk4_users',JSON.stringify(u));sw(n)}
function lgin(){const n=$('un').value.trim(),u=US();if(!u[n]||u[n].pin!=$('up').value)return alert('Sai tên hoặc mã PIN');sw(n)}
paint();go('home');
</script></body></html>
